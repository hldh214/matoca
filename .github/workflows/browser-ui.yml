name: Browser UI
"on": [push, pull_request]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group browser --frozen
      - run: uv run --group browser python -m playwright install --with-deps chromium
      - name: Run isolated browser tests
        shell: bash
        run: |
          log_file=$(mktemp "${RUNNER_TEMP:-/tmp}/matoca-browser-pytest.XXXXXX.log")
          set +e
          set -o pipefail
          uv run --group browser pytest -m browser \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --full-page-screenshot 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          mkdir -p test-results
          cp "$log_file" test-results/pytest.log
          if (( status != 0 )); then
            echo "::group::Browser pytest failure"
            tail -n 80 "$log_file"
            echo "::endgroup::"
            details=$(tail -n 80 "$log_file")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Browser pytest::${details}"
          fi
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: test-results/
          name: browser-test-results
