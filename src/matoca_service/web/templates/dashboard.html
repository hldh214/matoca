<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matoca | 加盟店を選ぶ</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#176b54">
    <link rel="stylesheet" href="/static/push.css">
    <script type="module" src="/static/push.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/merchant-selector.css') }}">
    <script type="module" src="{{ url_for('static', path='/tracking.js') }}" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="wordmark" href="/">Matoca</a>
      <button class="push-access" data-push-open type="button">通知の設定</button>
    </header>
    <main class="selector-main">
      <section class="personal-queues" aria-labelledby="personal-queues-title">
        <div>
          <p>現在の受付</p>
          <h1 id="personal-queues-title">あなたの順番待ち</h1>
        </div>
        <div id="personal-queues" aria-live="polite">順番待ちを確認しています</div>
      </section>
      <div class="page-title">
        <p>順番待ちサービス</p>
        <h1>利用する加盟店を選ぶ</h1>
      </div>
      <div class="merchant-grid">
        {% for merchant in merchants %}
          <a class="merchant-card" href="/merchants/{{ merchant.key }}">
            {% if merchant.cover_image_url %}
              <img class="merchant-photo merchant-photo-{{ merchant.key }}" src="{{ merchant.cover_image_url }}" alt="{{ merchant.name }}">
            {% else %}
              <div class="merchant-photo" role="img" aria-label="{{ merchant.name }}"></div>
            {% endif %}
            <div class="merchant-copy">
              <h2>{{ merchant.name }}</h2>
              <strong>店舗を見る <span aria-hidden="true">→</span></strong>
            </div>
          </a>
        {% endfor %}
      </div>
    </main>
    {% include 'push-dialog.html' %}
  </body>
</html>
