<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matoca | ブランドを選択</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/dashboard.css') }}">
  </head>
  <body>
    <header class="app-header">
      <a class="wordmark" href="/">Matoca</a>
      <span class="system-indicator"><i></i> 接続中</span>
    </header>
    <main class="selector-main">
      <div class="page-title">
        <p>順番待ちサービス</p>
        <h1>ブランドを選択</h1>
      </div>
      <div class="merchant-grid">
        {% for merchant in merchants %}
          <a class="merchant-card" href="/merchants/{{ merchant.key }}">
            <div class="merchant-photo merchant-photo-{{ merchant.key }}" role="img" aria-label="{{ merchant.name }}"></div>
            <div class="merchant-copy">
              <span>対応ブランド</span>
              <h2>{{ merchant.name }}</h2>
              <strong>店舗を見る <span aria-hidden="true">→</span></strong>
            </div>
          </a>
        {% endfor %}
      </div>
    </main>
  </body>
</html>
